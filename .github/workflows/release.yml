name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      - name: Install release tooling
        run: python -m pip install pre-commit python-semantic-release
      - name: Capture previous tag
        id: previous_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --hook-stage pre-commit
      - name: Run tests
        run: mvn -B test
      - name: Create semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
      - name: Resolve release artifacts
        id: release_artifacts
        run: |
          current_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          previous_tag="${{ steps.previous_tag.outputs.tag }}"
          if [ -n "$current_tag" ] && [ "$current_tag" != "$previous_tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
            echo "jar=$(find target -maxdepth 1 -type f -name '*-shaded-full.jar' | head -n 1)" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload shaded jar to GitHub release
        if: steps.release_artifacts.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_artifacts.outputs.tag }}
          files: ${{ steps.release_artifacts.outputs.jar }}
